[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live"
markers =
    live: hits real external APIs and re-records fixtures (run with: pytest -m live)
filterwarnings =
    # ADK 2.x prefers Workflow, but a Workflow cannot be an LlmAgent sub-agent yet (concierge -> pipeline)
    ignore:.*is deprecated in favor of Workflow:DeprecationWarning
